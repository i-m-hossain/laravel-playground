services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/server.conf:/etc/nginx/conf.d/default.conf

    environment:
      - TZ=Asia/Dhaka
    depends_on:
      - php-fpm
    networks:
      - playground_network

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - playground_network
    depends_on:
      - db
      - redis
    command: >
        sh -c "./docker/php/startup.sh"
  reverb:
    build:
        context: .
        dockerfile: ./docker/reverb/Dockerfile
    volumes:
        - .:/var/www/html
    depends_on:
        - redis
        - db
        - php-fpm
    environment:
        - APP_ENV=production
        - APP_DEBUG=false
        - REVERB_APP_ID=${REVERB_APP_ID}
        - REVERB_APP_KEY=${REVERB_APP_KEY}
        - REVERB_APP_SECRET=${REVERB_APP_SECRET}
        - REVERB_HOST=0.0.0.0
        - REVERB_PORT=8080
        - DB_HOST=${DB_HOST}
        - DB_DATABASE=${DB_DATABASE}
        - DB_USERNAME=${DB_USERNAME}
        - DB_PASSWORD=${DB_PASSWORD}
        - REDIS_HOST=${REDIS_HOST}
    ports:
        - "8081:8080"
    networks:
        - playground_network
  db:
    image: mysql:5.7
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

    networks:
      - playground_network

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    networks:
      - playground_network



volumes:
  db_data:

networks:
  playground_network:
    driver: bridge
